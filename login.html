<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoHub - Acceso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">⚡ TECNOHUB</div>
    <nav>
      <a href="index.html">Inicio</a>
    </nav>
  </header>

  <main style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <section class="card" style="width: 100%; max-width: 400px;">
      <h2>Iniciar Sesión</h2>
      <form action="dashboard.html">
        <div class="form-group">
          <label for="email">Correo Institucional</label>
          <input type="email" id="email" required placeholder="usuario@unipaz.edu.co">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
      </form>
    </section>
  </main>
</body>
</html>
